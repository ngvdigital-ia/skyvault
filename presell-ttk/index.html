<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Business Class for Less</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #ffffff;
            color: #000000;
            line-height: 1.4;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }

        .headline {
            font-size: 32px;
            font-weight: bold;
            color: #000000;
            margin-bottom: 20px;
            line-height: 1.3;
        }

        .highlight {
            color: #5bc0de;
        }

        .subheadline {
            font-size: 20px;
            font-weight: bold;
            color: #000000;
            margin-bottom: 30px;
        }

        .image-container {
            margin-bottom: 40px;
        }

        .image-container img {
            max-width: 100%;
            width: 400px;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .cta-button {
            display: inline-block;
            background-color: #007bff;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            padding: 15px 30px;
            border: none;
            cursor: pointer;
        }

        .cta-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="headline">
            If you've ever given up on a trip because of the <span class="highlight">flight price...</span> you need to see this
        </h1>

        <p class="subheadline">
            Find out how I travel the world in <span class="highlight">business class</span> paying less than economy!
        </p>

        <div class="image-container">
            <a href="https://skyvaultprogram.online/sv-ttk/">
                <img src="/presell-ttk/jetski-dubai.jpg" alt="Traveling in Dubai on a jet ski with Burj Al Arab in the background">
            </a>
        </div>

        <a href="https://skyvaultprogram.online/sv-ttk/" class="cta-button">
            Click here to watch now and find out!
        </a>
    </div>
</body>
</html>
